services:
  frontend:
    build:
      context: ./Frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5200
    depends_on:
      - backend

  backend:
    build:
      context: ./Backend
    ports:
      - "5200:5200"
    volumes:
      - game_library_data:/app/data
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/app.db"
      Igdb__ClientSecret: "${IGDB_CLIENT_SECRET:-}"
      Jwt__Key: "${JWT_KEY:-LocalDevelopmentOnly_ChangeThisKey_1234567890}"
      Jwt__Issuer: "${JWT_ISSUER:-GameLibrary}"
      Jwt__Audience: "${JWT_AUDIENCE:-GameLibrary}"

volumes:
  game_library_data: